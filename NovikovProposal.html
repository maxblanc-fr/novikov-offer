<style>
  /* ===== Novikov School — внутренний генератор PDF-предложений =====
     Цены и составы читаются при загрузке прямо из NovikovOffer.html,
     NovikovKids.html и NovikovNewYear.html (объекты DATA / SETS / BUFFET_IMG),
     поэтому правка цены на лендинге сразу попадает и сюда.               */
  :root{
    --red:#D6122B; --red-deep:#8E0A1B; --maroon:#4A0E14; --ink:#121212;
    --bone:#F4F1EC; --bone-2:#E9E4DC; --card:#FBF8F2; --line:#DCCFBC;
    --muted:#7c6f64; --ink-soft:#4a3d36; --green:#2FAF6B;
    --display:'Anton',sans-serif; --head:'Archivo',sans-serif; --body:'Manrope',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);color:var(--ink);background:var(--bone-2);font-size:14px;line-height:1.45}
  button,input,select,textarea{font:inherit;color:inherit}

  /* ---------- App shell ---------- */
  header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;
    background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff}
  .brand{font-family:var(--head);font-weight:900;font-size:19px;letter-spacing:.02em;line-height:1}
  .brand b{color:var(--bone)} .brand small{display:block;font-size:10px;letter-spacing:.24em;opacity:.85;margin-top:3px;font-weight:700}
  .top .sp{flex:1}
  .btn{border:1px solid var(--line);background:#fff;padding:9px 14px;cursor:pointer;font-family:var(--head);font-weight:700;
    font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--red-deep)}
  .btn:hover{border-color:var(--red)}
  .btn.main{background:#fff;color:var(--red);border-color:#fff;font-size:13px;padding:11px 18px}
  .btn.main:disabled{opacity:.6;cursor:wait}
  .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
  .btn.sm{padding:5px 9px;font-size:11px}
  .layout{display:grid;grid-template-columns:minmax(380px,520px) 1fr;min-height:calc(100vh - 62px)}
  @media(max-width:1000px){.layout{grid-template-columns:1fr}}
  aside.form{background:var(--bone);border-right:1px solid var(--line);padding:14px 16px 80px;overflow:auto;max-height:calc(100vh - 62px);position:sticky;top:62px}
  @media(max-width:1000px){aside.form{max-height:none;position:static}}
  main.preview{padding:20px;overflow:auto}
  #status{font-size:12px;opacity:.9}

  .kinds{display:flex;gap:0;margin-bottom:12px}
  .kinds button{flex:1;border:1px solid var(--line);background:#fff;padding:10px 6px;cursor:pointer;font-family:var(--head);
    font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--red-deep)}
  .kinds button+button{border-left:0}
  .kinds button.on{background:var(--red);color:#fff;border-color:var(--red)}

  details.box{background:#fff;border:1px solid var(--line);margin-bottom:10px}
  details.box>summary{list-style:none;cursor:pointer;padding:11px 14px;font-family:var(--head);font-weight:700;font-size:13px;
    text-transform:uppercase;letter-spacing:.05em;color:var(--red-deep);display:flex;gap:8px;align-items:center}
  details.box>summary::-webkit-details-marker{display:none}
  details.box>summary::after{content:"▾";margin-left:auto;transition:.15s}
  details.box[open]>summary::after{transform:rotate(180deg)}
  details.box>summary .cnt{background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:9px;letter-spacing:0}
  .bx{padding:4px 14px 14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
  .fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
  .fld.full{grid-column:1/-1}
  .fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--card);padding:8px 9px;font-size:14px;color:var(--ink);width:100%}
  .fld textarea{min-height:60px;resize:vertical}
  .sub{font-family:var(--head);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  .sub:first-child{margin-top:4px}
  .hint{font-size:12px;color:var(--muted);margin:4px 0 8px}

  .opt{display:grid;grid-template-columns:20px 1fr auto;gap:2px 8px;align-items:start;padding:7px 6px;border-bottom:1px dashed var(--bone-2)}
  .opt:hover{background:var(--card)}
  .opt input[type=checkbox],.opt input[type=radio]{margin:3px 0 0;accent-color:var(--red);width:16px;height:16px}
  .opt label{cursor:pointer}
  .opt .t{font-weight:700;font-size:13.5px;line-height:1.3}
  .opt .s{font-size:12px;color:var(--muted);line-height:1.35}
  .opt .pr{font-family:var(--head);font-weight:700;font-size:12.5px;color:var(--red-deep);white-space:nowrap;text-align:right}
  .opt .edit{grid-column:2/-1;display:none;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--muted)}
  .opt.on .edit{display:flex}
  .opt.on{background:#FFF4F2}
  .edit input{width:84px;border:1px solid var(--line);padding:4px 6px;background:#fff;font-size:13px}
  .edit input.q{width:58px}
  .edit .sum{margin-left:auto;font-weight:700;color:var(--ink)}
  .search{width:100%;border:1px solid var(--line);padding:8px 9px;margin:4px 0 6px;background:var(--card)}
  .barcat{font-weight:700;font-size:12px;color:var(--red-deep);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.06em}
  .baritem{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:4px 2px;border-bottom:1px dashed var(--bone-2);font-size:12.5px}
  .baritem.on{background:#FFF4F2}
  .baritem small{color:var(--muted)}
  .baritem .q{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);white-space:nowrap}
  .baritem input{width:44px;border:1px solid var(--line);padding:3px 4px;font-size:12.5px;background:#fff}
  .baritem input:disabled{visibility:hidden}
  .scroller{max-height:360px;overflow:auto;border:1px solid var(--bone-2);padding:0 6px}

  .tl-row{display:grid;grid-template-columns:52px 60px 1fr 26px;gap:6px;align-items:center;margin-bottom:5px}
  .tl-row .tm{font-family:var(--head);font-weight:700;font-size:12px;color:var(--red-deep)}
  .tl-row input{border:1px solid var(--line);padding:6px;background:var(--card);font-size:13px;width:100%}
  .tl-row button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px}
  .cust-row{display:grid;grid-template-columns:1fr 84px 54px 26px;gap:6px;margin-bottom:6px}
  .cust-row input{border:1px solid var(--line);padding:6px;background:var(--card);font-size:13px;width:100%}
  .cust-row button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px}
  .totalbar{position:sticky;bottom:-80px;margin:14px -16px -80px;padding:12px 16px;background:var(--maroon);color:#fff;display:flex;justify-content:space-between;align-items:center;font-family:var(--head);font-weight:700}
  .totalbar b{font-size:18px}

  /* ---------- A4 pages ---------- */
  #pages{display:flex;flex-direction:column;align-items:center;gap:22px;zoom:var(--z,1)}
  .page{width:794px;height:1123px;background:#FBF8F2;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(74,14,20,.18);
    display:flex;flex-direction:column;font-size:12.5px;line-height:1.5;color:var(--ink)}
  .pg-head{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 44px;
    background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff}
  .pg-head .brand{font-size:15px} .pg-head .brand small{font-size:7.5px}
  .pg-head .who{font-family:var(--head);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.92}
  .pc{flex:1;padding:26px 44px 10px;overflow:hidden}
  .pg-foot{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 44px;border-top:1px solid var(--line);
    font-size:9.5px;color:var(--muted);letter-spacing:.02em}
  .pg-foot b{color:var(--red-deep)}

  .h2{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;padding-top:6px}
  .h2 .no{font-family:var(--display);color:var(--red);font-size:30px;line-height:1}
  .h2 h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;text-transform:uppercase;color:var(--maroon);letter-spacing:.01em}
  .h2 .tag{margin-left:auto;font-family:var(--head);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
  .blk{margin-bottom:16px}
  .lead{font-size:13px;color:var(--ink-soft);margin:0 0 10px}
  .card{background:#fff;border:1px solid var(--line);padding:14px 16px}
  .card h3{margin:0 0 4px;font-family:var(--head);font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
  .card .meta{font-family:var(--head);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
  .card p{margin:6px 0 0;color:var(--ink-soft)}
  .ph{background-size:cover;background-position:center;background-color:var(--bone-2)}
  .strip{display:grid;gap:6px;margin-top:10px}
  .strip.c3{grid-template-columns:repeat(3,1fr)} .strip.c4{grid-template-columns:repeat(4,1fr)} .strip.c2{grid-template-columns:repeat(2,1fr)}
  .strip .ph{height:150px}
  .strip.c4 .ph{height:118px}
  .ticks{list-style:none;margin:6px 0 0;padding:0;columns:2;column-gap:22px}
  .ticks.one{columns:1}
  .ticks li{break-inside:avoid;padding:2px 0 2px 20px;position:relative;color:var(--ink-soft)}
  .ticks li::before{content:"";position:absolute;left:2px;top:7px;width:9px;height:5px;border-left:2px solid var(--red);border-bottom:2px solid var(--red);transform:rotate(-45deg)}
  .incl{display:inline-block;font-family:var(--head);font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    background:var(--green);color:#fff;padding:2px 7px;vertical-align:middle;margin-left:6px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---------- Константы ---------- */
const MANAGER = {name:"Максим Бланк", phone:"+7 903 161-80-65", tel:"+79031618065"};
const ADDRESS = "Москва, Большая Якиманка, 22";
const KINDS = {
  adult:{label:"Взрослое",    files:["index.html","NovikovOffer.html"],   kicker:"Предложение на мероприятие"},
  kids: {label:"Детское",     files:["deti.html","NovikovKids.html"],    kicker:"Детский праздник"},
  ny:   {label:"Новогоднее",  files:["newyear.html","NovikovNewYear.html"], kicker:"Новогоднее мероприятие"}
};
/* Шаблон тайминга, присланный Максимом 2026-10-07 */
const TL_TEMPLATE = [
  {m:30,  t:"Welcome-фуршет: закуски{ff}, сбор гостей"},
  {m:60,  t:"Мастер-класс с профессиональным шефом Novikov"},
  {m:30,  t:"Праздничный обед / ужин из приготовленных блюд"},
  {m:120, t:"Свободное время и активности"}
];
const COVER_IMG = {adult:"images/halls/cafe/22.jpg", ny:"images/halls/cafe/23.jpg", kids:"images/halls/cafe/21.jpg"};
const COOK_IMGS = ["images/halls/cafe/21.jpg","images/halls/cafe/24.jpg","images/halls/cafe/6.jpg"];
const LS_KEY = "novikov-proposal-v1";

/* ---------- Утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = o => o == null ? "" : typeof o === "string" ? o : (o.ru ?? "");
const strip = s => String(s ?? "").replace(/<[^>]+>/g, "");
const num = s => { if (typeof s === "number") return s; const m = String(s ?? "").replace(/[  ]/g," ").match(/\d[\d ]*/); return m ? parseInt(m[0].replace(/ /g,""),10) : 0; };
const rub = n => Math.round(n).toLocaleString("ru-RU").replace(/,/g," ") + " ₽";
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const n1 = n % 10; return n > 10 && n < 20 ? c : n1 > 1 && n1 < 5 ? b : n1 === 1 ? a : c; };
const UNIT_FORMS = {"гость":["гость","гостя","гостей"], "ребёнок":["ребёнок","ребёнка","детей"], "услуга":["услуга","услуги","услуг"], "порция":["порция","порции","порций"],
  "участник":["участник","участника","участников"], "набор":["набор","набора","наборов"], "мероприятие":["мероприятие","мероприятия","мероприятий"], "раунд":["раунд","раунда","раундов"]};
const qu = (q, u) => `${q} ${UNIT_FORMS[u] ? plural(q, ...UNIT_FORMS[u]) : u}`;

/* Вырезает литерал `const NAME = {…}` из исходника лендинга и вычисляет его. */
function grab(src, name){
  const at = src.search(new RegExp(`const ${name}\\s*=\\s*\\{`));
  if (at < 0) return null;
  const start = src.indexOf("{", at);
  let depth = 0, i = start, q = null;
  for (; i < src.length; i++){
    const c = src[i];
    if (q){ if (c === "\\") i++; else if (c === q) q = null; continue; }
    if (c === '"' || c === "'" || c === "`"){ q = c; continue; }
    if (c === "/" && src[i+1] === "/"){ i = src.indexOf("\n", i); continue; }
    if (c === "/" && src[i+1] === "*"){ i = src.indexOf("*/", i) + 1; continue; }
    if (c === "{") depth++;
    else if (c === "}" && --depth === 0) break;
  }
  return Function(`"use strict";return (${src.slice(start, i+1)});`)();
}

const SRC = {};
async function load(kind){
  if (SRC[kind]) return SRC[kind];
  /* На сайте берём клиентские страницы (index / deti / newyear), локально — файлы репозитория */
  let html = null;
  for (const f of KINDS[kind].files){
    const r = await fetch(f, {cache:"no-cache"}).catch(() => null);
    if (r && r.ok){ const h = await r.text(); if (/const DATA\s*=/.test(h)){ html = h; KINDS[kind].file = f; break; } }
  }
  if (!html) throw new Error("нет данных лендинга " + KINDS[kind].files.join(" / "));
  return SRC[kind] = {DATA:grab(html,"DATA"), SETS:grab(html,"SETS") || {}, BUFFET_IMG:grab(html,"BUFFET_IMG") || {}};
}
let MANIFEST = {};

/* ---------- Каталог: всё, что можно отметить ---------- */
/* Позиция: {key, sec, title, sub, price, per:'guest'|'kids'|'one', q0, unit, img[], detail[], from, req} */
function svcImgs(it){
  if (it.cardImgs) return it.cardImgs.slice(0,4);
  const n = L(it.name);
  if (/Торт/.test(n)) return ["uploads/cake-designs-v2/cd01.jpg","uploads/cake-designs-v2/cd02.jpg","uploads/cake-designs-v2/cd03.jpg","uploads/cake-designs-v2/cd04.jpg"];
  if (/Фартук/.test(n)) return ["uploads/aprons/branded.jpg","uploads/aprons/birthday.jpg"];
  return [];
}
function unitOf(p, n){
  const s = (p + " " + (n||"")).toLowerCase();
  if (/гост|чел|ребён/.test(s)) return {per:"guest", unit:"гость"};
  if (/бут/.test(s)) return {per:"one", unit:"бут."};
  if (/кг/.test(s)) return {per:"one", unit:"кг"};
  if (/шт/.test(s)) return {per:"one", unit:"шт."};
  if (/порци/.test(s)) return {per:"guest", unit:"порция"};
  return {per:"one", unit:"услуга"};
}

function buildCatalog(kind){
  const S = SRC[kind], D = S.DATA, A = SRC.adult.DATA;
  const sec = (d, t) => d.sections.find(s => s.type === t || s.id === t);
  const C = {pkgs:[], buffet:[], included:null, ff:[], bar:[], soft:[], services:[], halls:[], hallIncl:{}, softNote:""};

  /* Кулинарные пакеты */
  if (kind === "kids"){
    const pr = sec(D, "kids");
    pr.ages.forEach(a => a.packages.forEach(p => {
      const tl = a.tl.filter(r => !r.opt || p.game).map(r => ({m:r.m, t:r.ru}));
      if (!p.game && a.tl.some(r => r.opt)){ const fr = tl[tl.length-1]; fr.m += a.tl.filter(r=>r.opt).reduce((s,r)=>s+r.m,0); }
      C.pkgs.push({key:`pkg:${a.k}:${p.k}`, group:L(a.n), title:`${L(a.n)} · ${L(p.n)}`, short:L(p.n), price:num(p.price), per:"kids", unit:"ребёнок",
        desc:L(a.d), what:L(p.what), dishes:p.dishes, game:L(p.game), menu:a.menu, tl, buffet:"Kid Set", imgs:COOK_IMGS});
    }));
  } else {
    const st = sec(D, "sets");
    st.tabs.forEach(t => t.levels.forEach(l => C.pkgs.push({
      key:`pkg:${t.k}:${l.k}`, group:L(t.n), title:`${L(t.n)} · ${L(l.n)}`, short:L(l.n), price:num(l.price), per:"guest", unit:"гость",
      desc:L(t.d), buffet:l.buffet, bwt:l.bwt, setIds:l.ids, prem:l.prem ? L(st.premNote) : "",
      tl: t.k === "team" ? null : t.tl.map(r => ({m:r.m, t:r.ru})), imgs:COOK_IMGS})));
    const fm = sec(D, "formats");
    fm.groups.slice(1).forEach(g => g.items.forEach((it, i) => {
      const p = L(it.p) || it.p, parts = String(p).split("+");
      const isDemo = /open/i.test(L(g.head));
      C.pkgs.push({key:`pkg:f:${L(g.head)}:${i}`, group:L(g.head), title:`${L(g.head)} · ${L(it.n)}`, short:L(it.n),
        price:num(parts[0]), per: isDemo ? "guest" : "one", unit: isDemo ? "гость" : "мероприятие",
        extra: parts[1] ? {price:num(parts[1]), per:"guest", unit:"участник"} : null,
        desc:L(it.d), buffet: isDemo ? null : null,
        tl: isDemo ? [{m:30, t:"Встреча гостей, welcome-фуршет"},{m:210, t:"Шеф готовит, рассказывает о блюдах и угощает гостей"}]
                   : [{m:30, t:"Встреча гостей"},{m:180, t:"Мастер-класс: 3–4 блюда под руководством шефа"},{m:30, t:"Дегустация приготовленного"}],
        imgs:COOK_IMGS});
    }));
  }

  /* Фуршет */
  const bf = sec(D, "buffet") || sec(D, "menu");
  const imgOf = n => S.BUFFET_IMG[n] || SRC.adult.BUFFET_IMG[n];
  if (bf.canape){
    C.buffet.push({h:"Фуршетные сеты", items: bf.canape.map(c => ({key:`buf:set:${c.name.split(":")[0]}`, setName:c.name.split(":")[0].trim(),
      title:c.name, sub:`${c.wt} на гостя`, price:c.price, per:"guest", unit:"гость", detail:c.d, imgs:c.d.map(imgOf).filter(Boolean)}))});
    if (bf.platters) C.buffet.push({h:"Тарелки и ассорти", items: bf.platters.map(p => ({key:`buf:pl:${p.ru}`, title:p.ru, sub:[p.info, p.wt].filter(Boolean).join(" · "),
      price:p.price, per:"one", q0:1, unit:"шт.", imgs:p.img ? [p.img] : []}))});
    (bf.groups || []).forEach(g => C.buffet.push({h:L(g), note:L(g.note), items: g.rows.map(r => ({key:`buf:r:${r.ru}`, title:r.ru,
      price:r.price, per:"one", q0:6, unit:"порция"}))}));
    if (bf.kids) C.buffet.push({h:L(bf.kids.title), note:L(bf.kids.note), items: bf.kids.items.map(r => ({key:`buf:k:${r.ru}`, title:r.ru,
      sub:[r.info, r.wt].filter(Boolean).join(" · "), price:r.price, per:"one", q0:6, unit:"порция"}))});
  } else if (bf.blocks){
    let grp = "";
    bf.blocks.forEach(b => {
      if (b.gh){ grp = L(b.gh); return; }
      if (b.badge){ C.included = {title:L(b.h), list:b.list, imgs:b.list.map(imgOf).filter(Boolean)}; return; }
      const h = (grp ? grp + " · " : "") + L(b.h);
      if (b.list && b.price) C.buffet.push({h, items:[{key:`buf:set:${L(b.h)}`, title:L(b.h), sub:`${b.wt} на гостя`, price:b.price, per:"guest", unit:"гость",
        detail:b.list, imgs:b.list.map(imgOf).filter(Boolean)}]});
      else if (b.rows) C.buffet.push({h, note:L(b.hnote), items:b.rows.map(r => { const g = /гост/.test(r.wt||""); return {key:`buf:r:${L(b.h)}:${r.ru}`,
        title:r.ru, sub:[r.info, r.wt].filter(Boolean).join(" · "), price:r.price, per: g ? (grp ? "guest" : "kids") : "one", q0: g ? null : 1, unit: g ? "гость" : "шт.", imgs:r.img ? [r.img] : []}; })});
    });
  }

  /* Напитки — у детского лендинга своего бара нет, берём взрослый */
  const DD = kind === "kids" ? A : D;
  const ffs = sec(DD, "freeflow");
  if (ffs) C.ff = ffs.packages.map(p => ({key:`ff:${p.code}`, code:p.code, title:`Free-flow «${L(p.name)}»`, short:L(p.name), price:num(p.price), ext:num(p.ext), per:"guest", unit:"гость", cats:p.cats}));
  const bar = DD.sections.find(s => s.id === "bar");
  if (bar) C.bar = bar.cats.map((c, ci) => ({h:L(c), kind:c.kind, items:c.items.map(it => ({name:it[0] || "Коктейль по выбору", origin:it[1], glass:it[2], bottle:it[3], pre:!!it[4],
    gUnit: c.kind === "spirit" ? "50 мл" : c.kind === "cocktail" ? "порция" : "бокал"}))}));
  const soft = DD.sections.find(s => s.id === "soft");
  if (soft){
    C.softNote = L(soft.price);
    soft.cats.forEach(c => String(c.unit || "").split("·").forEach(part => {
      if (!/₽/.test(part)) return;
      const u = part.split("/").slice(1).join("/").trim(), g = /гост/.test(u);
      C.soft.push({key:`soft:${L(c)}:${u}`, title:`${L(c)}${g ? "" : ", " + u}`, sub:c.items.map(x => x[0]).join(", "), price:num(part),
        per: g ? "guest" : "one", q0: g ? null : 1, unit: g ? "гость" : "шт.", detail:c.items.map(x => x[0])});
    }));
  }

  /* Доп. услуги */
  const sv = sec(D, "services");
  sv.items.forEach(it => {
    const name = L(it.name), imgs = svcImgs(it), desc = strip(L(it.desc)), lines = [];
    const pstr = L(it.price);
    if (it.tiers){
      if (/^[А-ЯA-Z][а-яa-z]+ \d/.test(pstr)){ const part = pstr.split("·")[0]; lines.push({lab:part.replace(/[\d\s]+₽.*$/,"").trim(), price:num(part), ...unitOf(part)}); }
      it.tiers.forEach(t => { const pack = /^\d+ шт/.test(t.n || ""); const u = pack ? {per:"one", unit:"набор"} : unitOf(t.p, t.n);
        lines.push({lab:L(t.l) + (pack ? ` (${t.n})` : ""), price:num(t.p), note:pack ? "" : t.n, from:/^от/.test(t.p), ...u}); });
    } else if (/₽/.test(pstr)){
      const parts = pstr.split("·").filter(p => /\d/.test(p) && /₽/.test(p)), g = /гост/.test(pstr), min = (pstr.match(/минимум (\d+)/) || [])[1];
      parts.forEach(p => { const lab = p.replace(/(от\s*)?[\d\s]+₽.*$/,"").trim(); const u = g ? {per:"guest", unit:"гость"} : unitOf(p);
        lines.push({lab: lab ? lab[0].toUpperCase() + lab.slice(1) : "", price:num(p), from:/от/.test(p), ...u, q0: min ? +min : null}); });
    } else lines.push({lab:"", price:0, req:true, per:"one", unit:"услуга"});
    C.services.push({h:name, desc, imgs, min:L(it.min), items: lines.map(l => ({key:`svc:${name}:${l.lab}`, svc:name,
      title: l.lab ? `${name} · ${l.lab}${/час/.test(l.note||"") ? `, ${l.note}` : ""}` : name, short:l.lab ? `${l.lab}${/час/.test(l.note||"") ? `, ${l.note}` : ""}` : "", lab:l.lab, sub:[l.note, l.from ? "цена от" : "", l.req ? "цена по запросу — впишите" : ""].filter(Boolean).join(" · "),
      price:l.price, per: kind === "kids" && l.per === "guest" ? "kids" : l.per, q0:l.q0 ?? (l.per === "one" ? 1 : null), unit:l.unit, req:l.req, desc, imgs, dur:/^1 час/.test(l.note||"") && it.tags ? 60 : 0, generic:/персонал/i.test(name)}))});
  });

  /* Залы */
  const vn = sec(D, "venues"), va = sec(A, "venues");
  C.halls = vn.halls.map(h => ({slug:h.slug, title:L(h.n), area:h.area, cap:L(h.cap), biz:/бизнес/.test(L(h.n)), tab:h.tabs ? h.tabs[0].k : null}));
  C.hallIncl = (vn.incl || va.incl);
  return C;
}

/* ---------- Состояние ---------- */
function blank(){
  return {kind:"adult", client:"", contact:"", occasion:"", date:"", start:"19:00", guests:12, kids:10, hall:"", pkg:"", setId:"", dishes:[],
    ff:"", ffHours:0, sel:{}, bar:{}, custom:[], discount:0, valid:"", note:"", vat:true, tl:null};
}
let ST = blank(), CAT = null;
try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.kind) ST = Object.assign(blank(), s); } catch(e){}
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(ST)); } catch(e){} };

const allItems = () => [...CAT.buffet.flatMap(g => g.items), ...CAT.soft, ...CAT.services.flatMap(g => g.items)];
const pkg = () => CAT.pkgs.find(p => p.key === ST.pkg);
const defQty = it => it.per === "guest" ? (+ST.guests || 0) : it.per === "kids" ? (+ST.kids || 0) : (it.q0 ?? 1);
const qtyOf = it => { const s = ST.sel[it.key]; return s && s.qty != null && s.qty !== "" ? +s.qty : defQty(it); };
const priceOf = it => { const s = ST.sel[it.key]; return s && s.price != null && s.price !== "" ? +s.price : it.price; };
const isOn = it => !!(ST.sel[it.key] && ST.sel[it.key].on);
const guestsLabel = () => ST.kind === "kids" ? `${+ST.kids||0} ${plural(+ST.kids,"ребёнок","ребёнка","детей")}${+ST.guests ? ` + ${ST.guests} ${plural(+ST.guests,"взрослый","взрослых","взрослых")}` : ""}` : `${+ST.guests||0} ${plural(+ST.guests,"гость","гостя","гостей")}`;

/* Включённый в пакет фуршет */
function includedBuffet(){
  const p = pkg(); if (!p) return null;
  if (ST.kind === "kids") return CAT.included ? {title:CAT.included.title, list:CAT.included.list, imgs:CAT.included.imgs} : null;
  if (!p.buffet) return null;
  const s = CAT.buffet[0].items.find(i => i.setName === p.buffet);
  return s ? {title:`${s.title}`, wt:p.bwt, list:s.detail, imgs:s.imgs, key:s.key} : null;
}

const ibShort = ib => { const s = ib.title.split(":")[0].trim(); return /фуршет/i.test(s) ? s : `Фуршет ${s}`; };
/* Строки сметы */
function lines(){
  const out = [], p = pkg();
  if (p){
    const q = p.per === "kids" ? +ST.kids : p.per === "guest" ? +ST.guests : 1;
    out.push({g:"Кулинарная программа", t:p.title, q, u:p.unit, pr:p.price});
    if (p.extra) out.push({g:"Кулинарная программа", t:`${p.short}: каждый участник`, q:+ST.guests, u:p.extra.unit, pr:p.extra.price});
    const ib = includedBuffet();
    if (ib) out.push({g:"Кулинарная программа", t:ibShort(ib), incl:true});
  }
  const ff = CAT.ff.find(f => f.key === ST.ff);
  if (ff){
    out.push({g:"Напитки", t:`${ff.title}, 4 часа`, q:+ST.guests, u:"гость", pr:ff.price});
    if (+ST.ffHours) out.push({g:"Напитки", t:`Продление free-flow, +${ST.ffHours} ч <small>· ${rub(ff.ext)} за час</small>`, q:+ST.guests, u:"гость", pr:ff.ext * +ST.ffHours});
  }
  CAT.bar.forEach(c => c.items.forEach(it => {
    const b = ST.bar[`${c.h}|${it.name}`]; if (!b) return;
    if (+b.g && it.glass) out.push({g:"Напитки", t:`${it.name}${it.origin && c.kind !== "cocktail" ? ` <small>· ${esc(it.origin)}</small>` : ""}`, q:+b.g, u:it.gUnit, pr:it.glass});
    if (+b.b && it.bottle) out.push({g:"Напитки", t:`${it.name}${it.origin ? ` <small>· ${esc(it.origin)}</small>` : ""}`, q:+b.b, u: c.kind === "cocktail" ? "порция" : "бут.", pr:it.bottle});
  }));
  CAT.soft.forEach(it => { if (isOn(it)) out.push({g:"Напитки", t:esc(it.title), q:qtyOf(it), u:it.unit, pr:priceOf(it)}); });
  const ibKey = (includedBuffet() || {}).key;
  CAT.buffet.forEach(g => g.items.forEach(it => { if (isOn(it) && it.key !== ibKey) out.push({g:"Фуршет", t:esc(it.title), q:qtyOf(it), u:it.unit, pr:priceOf(it)}); }));
  CAT.services.forEach(g => g.items.forEach(it => { if (isOn(it)) out.push({g:"Дополнительные услуги", t:esc(it.title), q:qtyOf(it), u:it.unit, pr:priceOf(it), req:it.req && !priceOf(it)}); }));
  ST.custom.forEach(c => { if (c.t) out.push({g:"Дополнительно", t:esc(c.t), q:+c.q || 1, u:"", pr:+c.p || 0, req:!+c.p}); });
  out.forEach(l => { if (!l.incl) l.sum = (l.pr || 0) * (l.q || 0); });
  return out;
}
function totals(){
  const ls = lines(), sub = ls.reduce((s, l) => s + (l.sum || 0), 0), d = Math.min(100, Math.max(0, +ST.discount || 0));
  const disc = Math.round(sub * d / 100), tot = sub - disc, heads = (ST.kind === "kids" ? +ST.kids + +ST.guests : +ST.guests) || 0;
  return {ls, sub, d, disc, tot, per: heads ? tot / heads : 0, heads};
}

/* Тайминг: авто по шаблону, пока его не правили руками */
function autoTimeline(){
  const p = pkg();
  let rows = p && p.tl ? p.tl.map(r => ({...r})) : TL_TEMPLATE.map(r => ({m:r.m, t:r.t.replace("{ff}", ST.ff ? ", игристое" : "")}));
  if (ST.kind !== "kids" || !(p && p.game)){
    const games = CAT.services.flatMap(g => g.items).filter(it => isOn(it) && it.dur);
    const free = rows.find(r => /Свободное время/.test(r.t));
    games.forEach(g => { if (free && free.m > g.dur){ free.m -= g.dur; rows.splice(rows.indexOf(free), 0, {m:g.dur, t:`${g.svc}: ${g.lab.toLowerCase() === "игра" ? "игра с ведущим" : g.lab}`}); } });
  }
  return rows;
}
const timeline = () => ST.tl || autoTimeline();
const addMin = (hm, m) => { const [h, mi] = (hm || "00:00").split(":").map(Number); const t = h*60 + mi + m; return `${String(Math.floor(t/60)%24).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`; };
const endTime = () => addMin(ST.start, timeline().reduce((s, r) => s + (+r.m || 0), 0));
function dateRu(d){
  if (!d) return "";
  const x = new Date(d + "T12:00:00");
  return x.toLocaleDateString("ru-RU", {day:"numeric", month:"long", year:"numeric"}) + ", " + x.toLocaleDateString("ru-RU", {weekday:"long"});
}

/* ---------- События формы ---------- */
let rT = 0;
const rerender = (form = true) => { save(); if (form) renderForm(); clearTimeout(rT); rT = setTimeout(renderPages, 250); };
const F = $("#form");
F.addEventListener("click", async e => {
  const k = e.target.closest("[data-kind]");
  if (k && k.dataset.kind !== ST.kind){ await switchKind(k.dataset.kind); return; }
  if (e.target.id === "addCustom"){ ST.custom.push({t:"", p:"", q:1}); rerender(); return; }
  if (e.target.dataset.cdel != null){ ST.custom.splice(+e.target.dataset.cdel, 1); rerender(); return; }
  if (e.target.id === "addTl"){ ST.tl = timeline().map(r => ({...r})); ST.tl.push({m:30, t:""}); rerender(); return; }
  if (e.target.id === "resetTl"){ ST.tl = null; rerender(); return; }
  if (e.target.dataset.del != null){ ST.tl = timeline().map(r => ({...r})); ST.tl.splice(+e.target.dataset.del, 1); rerender(); return; }
});
F.addEventListener("change", e => {
  const t = e.target, row = t.closest(".opt");
  if (row && (t.type === "checkbox" || t.type === "radio")){
    if (row.dataset.dish != null){ const d = row.dataset.dish; ST.dishes = t.checked ? [...ST.dishes, d] : ST.dishes.filter(x => x !== d); rerender(); return; }
    if (t.name === "pkg"){ ST.pkg = row.dataset.key; ST.setId = ""; ST.dishes = []; rerender(); return; }
    if (t.name === "ff"){ ST.ff = row.dataset.key; if (!ST.ff) ST.ffHours = 0; rerender(); return; }
    const key = row.dataset.key; ST.sel[key] = {...(ST.sel[key] || {}), on:t.checked}; rerender(); return;
  }
  if (t.id === "setId"){ ST.setId = t.value; rerender(); return; }
  if (t.id === "hall"){ ST.hall = t.value; rerender(); return; }
  if (t.id === "vat"){ ST.vat = t.checked; rerender(false); return; }
  if (["date","valid","start"].includes(t.id)){ ST[t.id] = t.value; rerender(); return; }
});
F.addEventListener("input", e => {
  const t = e.target;
  if (["client","contact","occasion","note"].includes(t.id)){ ST[t.id] = t.value; rerender(false); return; }
  if (["guests","kids","discount","ffHours"].includes(t.id)){ ST[t.id] = t.value === "" ? 0 : +t.value; softUpdate(); return; }
  if (t.id === "barSearch"){ const q = t.value.toLowerCase().trim(); F.querySelectorAll(".baritem").forEach(r => r.style.display = !q || r.dataset.s.includes(q) ? "" : "none"); return; }

    const key = opt.dataset.key, s = ST.sel[key] = {...(ST.sel[key] || {on:true})};
    if (t.classList.contains("p")) s.price = t.value; else s.qty = t.value;
    const it = allItems().find(i => i.key === key); if (it) opt.querySelector(".sum").textContent = rub(priceOf(it) * qtyOf(it));
    softUpdate(); return;
  }
  const bi = t.closest(".baritem");
  if (bi){ const k = bi.dataset.bk, b = ST.bar[k] = {...(ST.bar[k] || {})}; b[t.dataset.f] = t.value; if (!+b.g && !+b.b) delete ST.bar[k];
    bi.classList.toggle("on", !!ST.bar[k]); softUpdate(); return; }
  const tr = t.closest(".tl-row");
  if (tr){ ST.tl = timeline().map(r => ({...r})); const r = ST.tl[+tr.dataset.i]; r[t.dataset.f] = t.dataset.f === "m" ? +t.value : t.value; softUpdate(true); return; }
  const cr = t.closest(".cust-row");
  if (cr){ ST.custom[+cr.dataset.i][t.dataset.f] = t.value; softUpdate(); return; }
});
/* Ввод в полях не перерисовывает форму (фокус остаётся), только итог и предпросмотр */
let fT = 0;
function softUpdate(tl){
  save();
  const T = totals(); const tb = F.querySelector(".totalbar"); if (tb) tb.innerHTML = `<span>Итого${T.d ? ` (−${T.d}%)` : ""}</span><b>${rub(T.tot)}</b>`;
  if (tl){ let t0 = ST.start; F.querySelectorAll(".tl-row").forEach((r, i) => { r.querySelector(".tm").textContent = t0; t0 = addMin(t0, +(ST.tl[i] || {}).m || 0); }); }
  clearTimeout(rT); rT = setTimeout(renderPages, 400);
  clearTimeout(fT); fT = setTimeout(() => { const a = document.activeElement; if (!F.contains(a)) renderForm(); }, 1500);
}

async function switchKind(k){
  $("#status").textContent = "Загружаю цены…";
  try { await load(k); } catch(e){ $("#status").textContent = "Не удалось загрузить: " + KINDS[k].files.join(" / "); return; }
  ST.kind = k; ST.pkg = ""; ST.setId = ""; ST.dishes = []; ST.sel = {}; ST.ff = ""; ST.ffHours = 0; ST.bar = {}; ST.tl = null; ST.hall = "";
  CAT = buildCatalog(k); $("#status").textContent = "Цены: " + KINDS[k].file;
  rerender();
}

/* ---------- PDF-страницы ---------- */
const bg = u => `style="background-image:url('${esc(u)}')"`;
function hallPhotos(h, n){
  if (!h) return [];
  const base = h.tab ? `images/halls/${h.slug}/${h.tab}` : `images/halls/${h.slug}`;
  const list = (h.tab ? (MANIFEST[h.slug] || {})[h.tab] : MANIFEST[h.slug]) || [];
  const files = Array.isArray(list) ? list : [];
  const pick = h.slug === "cafe" ? ["22.jpg","10.jpg","6.jpg","14.jpg"] : files;
  return pick.slice(0, n).map(f => `${base}/${f}`);
}

function buildBlocks(){
  const T = totals(), p = pkg(), C = CAT, ib = includedBuffet(), hall = C.halls.find(h => h.slug === ST.hall);
  const ff = C.ff.find(f => f.key === ST.ff), set = p && ST.setId ? SRC[ST.kind].SETS[ST.setId] : null;
  const bufOn = C.buffet.flatMap(g => g.items).filter(it => isOn(it) && it.key !== (ib||{}).key);
  const softOn = C.soft.filter(isOn), svcOn = C.services.flatMap(g => g.items).filter(isOn);
  const barOn = []; C.bar.forEach(c => c.items.forEach(it => { const b = ST.bar[`${c.h}|${it.name}`]; if (b) barOn.push({c, it, b}); }));
  const blocks = []; let no = 0;
  const H = (title, tag) => blocks.push({kwn:true, html:`<div class="h2"><span class="no">${String(++no).padStart(2,"0")}</span><h2>${esc(title)}</h2>${tag ? `<span class="tag">${esc(tag)}</span>` : ""}</div>`});
  const B = (html, split) => blocks.push({html:`<div class="blk">${html}</div>`, split});

  /* Обзор */
  const ov = [];

    p.menu ? (ST.dishes.length ? `Блюда: ${ST.dishes.join(", ")}` : `${p.dishes} блюда: ${p.what}`) : "", p.game ? `Игра: ${p.game[0].toLowerCase() + p.game.slice(1)}` : "", "Профессиональный шеф Novikov, все продукты и инвентарь"].filter(Boolean)]);
  const fb = []; if (ib) fb.push(`${ib.title}${ib.wt ? ` (${ib.wt} на гостя)` : ""} — входит в пакет`); bufOn.forEach(it => fb.push(`${it.title}${it.unit === "гость" ? "" : ` × ${qtyOf(it)}`}`));
  if (fb.length) ov.push(["Фуршет", fb]);
  const dr = []; if (ff) dr.push(`${ff.title} — безлимит 4 часа${+ST.ffHours ? ` + ${ST.ffHours} ч` : ""}`); softOn.forEach(it => dr.push(it.title)); barOn.forEach(({c, it, b}) => dr.push(`${it.name}${+b.b ? ` × ${b.b} ${c.kind === "cocktail" ? "порц." : "бут."}` : ""}${+b.g ? ` × ${b.g} ${it.gUnit}` : ""}`));
  dr.push(C.softNote || "Вода, чай и кофе включены");
  ov.push(["Напитки", dr]);
  if (svcOn.length || ST.custom.some(c => c.t)) ov.push(["Доп. услуги", [...svcOn.map(it => it.title + (it.unit !== "гость" && qtyOf(it) > 1 ? ` × ${qtyOf(it)}` : "")), ...ST.custom.filter(c => c.t).map(c => c.t)]]);
  const inclTxt = hall ? (hall.biz ? L(C.hallIncl.business) : L(C.hallIncl.culinary)) : L(C.hallIncl.culinary);
  ov.push(["Площадка", [hall ? `Зал «${hall.title}», ${hall.area}` : "", ...inclTxt.split("·").map(s => s.trim()).filter(Boolean).map(s => s[0].toUpperCase() + s.slice(1))].filter(Boolean)]);
  H("Что входит", "всё в одном месте");
  B(`<p class="lead">Ниже — полный состав вашего мероприятия. Всё перечисленное уже учтено в стоимости.</p>`);

    if (softOn.length) B(`<div class="card"><div class="meta">Безалкогольное</div><ul class="ticks one">${softOn.map(it => `<li><b>${esc(it.title)}</b>${it.unit === "гость" ? "" : ` × ${qtyOf(it)}`}<br><span style="font-size:11.5px">${esc(it.sub)}</span></li>`).join("")}</ul></div>`);

  const rows = T.ls.map(l => { let s = ""; if (l.g !== g0){ g0 = l.g; s += `<tr class="grp"><td colspan="4">${esc(l.g)}</td></tr>`; }
    return s + `<tr><td>${l.t}</td><td class="n">${l.incl ? "" : esc(qu(l.q, l.u))}</td><td class="n">${l.incl || l.req ? "" : rub(l.pr)}</td><td class="n">${l.incl ? "включено" : l.req ? "по запросу" : rub(l.sum)}</td></tr>`; }).join("");
  blocks.push({split:true, html:`<div class="blk"><table class="est"><thead><tr><th>Позиция</th><th class="n">Кол-во</th><th class="n">Цена</th><th class="n">Сумма</th></tr></thead><tbody class="rows">${rows}</tbody></table></div>`});
  B(`<div class="totals">${T.d ? `<div><span>Сумма</span><b>${rub(T.sub)}</b></div><div><span>Скидка ${T.d}%</span><b>−${rub(T.disc)}</b></div>` : ""}
    <div class="big"><span>Итого</span><span>${rub(T.tot)}</span></div>${T.heads ? `<div class="pg">≈ ${rub(T.per)} на ${ST.kind === "kids" ? "участника" : "гостя"}</div>` : ""}</div>
    ${ST.note ? `<div class="card" style="margin-top:12px"><div class="meta">Комментарий</div><p>${esc(ST.note).replace(/\n/g,"<br>")}</p></div>` : ""}
    <p class="fine">${[ST.vat ? "В стоимость не включён НДС 22%." : "", ST.valid ? `Предложение действительно до ${new Date(ST.valid + "T12:00:00").toLocaleDateString("ru-RU", {day:"numeric", month:"long", year:"numeric"}).replace(/ г\.$/, "")} г.` : ""].filter(Boolean).join(" ")}</p>
    <div class="mgr"><div><div class="l">Ваш менеджер</div><div class="n">${MANAGER.name}</div></div><div class="ph2">${MANAGER.phone}</div></div>`);
  return {blocks, T, p, hall, ff};
}

function renderPages(){
  if (!CAT) return;
  const box = $("#pages"), z = box.style.getPropertyValue("--z"); box.style.setProperty("--z", 1);
  box.innerHTML = "";
  const {blocks, T, p, hall, ff} = buildBlocks();
  box.appendChild(coverPage(T, p, hall, ff));
  let page, pc;
  const newPage = () => { page = pageShell(); box.appendChild(page); pc = page.querySelector(".pc"); };
  const over = () => pc.scrollHeight > pc.clientHeight + 1;
  newPage();
  const place = (el, split) => {
    pc.appendChild(el);
    if (!over()) return;
    if (split){
      const body = el.querySelector(".rows"), rows = [...body.children], rest = [];
      while (over() && rows.length){ const r = rows.pop(); r.remove(); rest.unshift(r); }
      if (rows.length >= 3 || (rows.length && pc.children.length === 1)){
        if (rest.length){ const c = el.cloneNode(true); const cb = c.querySelector(".rows"); cb.innerHTML = ""; rest.forEach(r => cb.appendChild(r)); newPage(); place(c, true); }
        return;
      }
      rest.forEach(r => body.appendChild(r));
    }
    if (pc.children.length > 1){
      el.remove();
      const prev = pc.lastElementChild, carry = prev && prev.dataset.kwn ? prev : null;
      if (carry) carry.remove();
      newPage(); if (carry) pc.appendChild(carry); place(el, split);
    }
  };
  blocks.forEach(b => { const w = document.createElement("div"); w.innerHTML = b.html; const el = w.firstElementChild; if (b.kwn) el.dataset.kwn = 1; place(el, b.split); });
  const pages = [...box.querySelectorAll(".page")];
  pages.forEach((pg, i) => { const n = pg.querySelector(".pn"); if (n) n.textContent = `${i + 1} / ${pages.length}`; });
  fitPreview();
}
function fitPreview(){
  const box = $("#pages"), w = box.parentElement.clientWidth - 40;
  box.style.setProperty("--z", Math.min(1, w / 794).toFixed(3));
}
addEventListener("resize", fitPreview);

/* ---------- Выгрузка ---------- */
async function waitImages(root){
  const urls = new Set();
  root.querySelectorAll(".ph").forEach(e => { const m = (e.style.backgroundImage || "").match(/url\(["']?(.*?)["']?\)/); if (m) urls.add(m[1]); });
  await Promise.all([...urls].map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u; })));
  await document.fonts.ready;
}
$("#bPdf").addEventListener("click", async () => {
  const b = $("#bPdf"); b.disabled = true; const old = b.textContent;
  try {
    clearTimeout(rT); renderPages();
    const box = $("#pages"); box.style.setProperty("--z", 1);
    await waitImages(box);
    const {jsPDF} = window.jspdf, pdf = new jsPDF({unit:"mm", format:"a4", compress:true});
    const pages = [...box.querySelectorAll(".page")];
    for (let i = 0; i < pages.length; i++){
      b.textContent = `Страница ${i + 1} из ${pages.length}…`;
      const cv = await html2canvas(pages[i], {scale:2, useCORS:true, backgroundColor:"#FBF8F2", logging:false, windowWidth:900});
      if (i) pdf.addPage();
      pdf.addImage(cv.toDataURL("image/jpeg", 0.88), "JPEG", 0, 0, 210, 297, undefined, "FAST");
    }
    const nm = ["Novikov", ST.client || "предложение", ST.date].filter(Boolean).join("_").replace(/[\\/:*?"<>|«»]+/g, "").replace(/\s+/g, "_");
    pdf.save(nm + ".pdf");
  } catch(e){ alert("Не получилось собрать PDF: " + e.message); console.error(e); }
  finally { b.disabled = false; b.textContent = old; fitPreview(); }
});
$("#bPrint").addEventListener("click", () => { renderPages(); waitImages($("#pages")).then(() => print()); });

  const d = new Date(Date.now() + 21*864e5); ST.date = d.toISOString().slice(0,10);
  Object.assign(ST, {client:"ООО «Пример»", occasion:"Корпоративный вечер", guests:16, start:"19:00", hall:"cafe", pkg:"pkg:team:std", ff:"ff:FF1"});
  CAT.services.flatMap(g => g.items).forEach(it => { if (/Официант/.test(it.short) || (/Интерактивные/.test(it.svc) && it.lab === "Игра")) ST.sel[it.key] = {on:true}; });
  rerender();
});

/* ---------- Старт ---------- */
(async () => {
  try {
    await load("adult");
    if (ST.kind !== "adult") await load(ST.kind);
    MANIFEST = await fetch("images/halls/manifest.json").then(r => r.json()).catch(() => ({}));
    CAT = buildCatalog(ST.kind);
    $("#status").textContent = "Цены: " + KINDS[ST.kind].file;
    renderForm(); renderPages();
  } catch(e){
    console.error(e);
    $("#status").textContent = "Ошибка загрузки данных";
    $("#pages").innerHTML = `<div class="empty">Не удалось прочитать цены с лендингов (${esc(e.message)}). Страницу нужно открывать через сервер, а не как файл.</div>`;
  }
})();
</script>
